# Deploy-Automatik – einmal von Hand starten:  docker compose up -d --build
# Danach im Browser http://<server>:8095 öffnen, Passwort festlegen, Zugänge eintragen.
services:
  deploy-automatik:
    build: .
    image: deploy-automatik:1.2.4
    container_name: deploy-automatik
    restart: unless-stopped
    ports:
      - "8095:8000"
    environment:
      TZ: Europe/Berlin
      # Optional: festes Passwort statt Festlegen beim ersten Aufruf
      # ADMIN_PASSWORD: "…"
    volumes:
      - deploy-automatik-daten:/data

volumes:
  deploy-automatik-daten:
